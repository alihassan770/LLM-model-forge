{% extends "auth_base.html" %}
{% block title %}Create an account · Model Forge{% endblock %}

{% block auth_form %}
<header class="auth-head reveal" style="--d: .05s">
  <span class="brand-mark mobile-only">MF</span>
  <h1>Create your account</h1>
  <p class="muted">You will be the owner of a new organisation.</p>
</header>

{% if error %}
<div class="alert alert-error shake" role="alert">
  <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
    <circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M10 5.8v5M10 13.6v.6" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round"/>
  </svg>
  <span>{{ error }}</span>
</div>
{% endif %}

<form method="post" action="/signup" class="stack">
  <label class="field reveal" style="--d: .10s">
    <span>Organisation name</span>
    <div class="input-wrap">
      <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 16.5h14M4.5 16.5v-11l5.5-2 5.5 2v11" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8.5 16.5v-3h3v3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <input type="text" name="org_name" value="{{ org_name or '' }}" required autofocus
             placeholder="Acme Furniture">
    </div>
  </label>

  <label class="field reveal" style="--d: .16s">
    <span>Your name</span>
    <div class="input-wrap">
      <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 16.5c0-3 2.7-4.8 6-4.8s6 1.8 6 4.8" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" name="name" value="{{ name or '' }}" autocomplete="name"
             placeholder="Optional">
    </div>
  </label>

  <label class="field reveal" style="--d: .22s">
    <span>Email</span>
    <div class="input-wrap">
      <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="2.5" y="4.5" width="15" height="11" rx="2.2" fill="none"
              stroke="currentColor" stroke-width="1.5"/>
        <path d="M3 6l7 5 7-5" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <input type="email" name="email" value="{{ email or '' }}" required
             autocomplete="email" placeholder="you@company.com">
    </div>
  </label>

  <label class="field reveal" style="--d: .28s">
    <span>Password</span>
    <div class="input-wrap">
      <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="4" y="8.5" width="12" height="8" rx="2" fill="none"
              stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 8.5V6.6a3 3 0 016 0v1.9" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="password" name="password" id="password" required minlength="6"
             autocomplete="new-password" placeholder="••••••">
      <button type="button" class="peek" data-peek="password"
              aria-label="Show password">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M1.8 10S5 4.8 10 4.8 18.2 10 18.2 10 15 15.2 10 15.2 1.8 10 1.8 10z"
                fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor"
                  stroke-width="1.5"/>
        </svg>
      </button>
    </div>
    <small class="muted">At least 6 characters.</small>
  </label>

  <button type="submit" class="btn btn-primary btn-block reveal" style="--d: .34s">
    <span>Create account</span>
    <svg class="btn-arrow" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M4 10h11M10.5 5.5L15 10l-4.5 4.5" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</form>

<p class="auth-foot muted reveal" style="--d: .40s">
  Already have an account? <a href="/login">Sign in</a>
</p>
{% endblock %}
